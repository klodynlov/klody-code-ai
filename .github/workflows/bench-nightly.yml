name: Bench nightly (MLX)

# Nightly bench non-régression. Tourne UNIQUEMENT sur runner self-hosted
# macOS avec la pile d'inférence locale joignable (Apple Silicon).
#
# ⚠️ Il n'existe PAS de job sentinelle : sans runner portant les labels ci-dessous,
# chaque run planifié reste en file puis est annulé au timeout. C'est ce qui s'est
# produit sur l'intégralité des runs jusqu'au 2026-07-29 (aucune exécution réelle).
# Vérifier `Settings → Actions → Runners` avant de conclure quoi que ce soit d'un
# historique vert-vide.
#
# Setup requis (une fois) :
#   1. Settings → Actions → Runners → New self-hosted runner (macOS)
#   2. Labels : self-hosted, macOS, klody
#   3. Sur le Mac : le gateway Klody Core (:8090), Ollama et bge-m3 doivent tourner
#      avant le run planifié (LaunchAgents — cf. docs/OPS.md et README-local-ai.md)

on:
  schedule:
    # 03:00 UTC = 05:00 Paris (heure d'hiver) / 04:00 Paris (heure d'été)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Catégorie (easy/medium/hard ou vide=toutes)"
        required: false
        default: ""

# GITHUB_TOKEN au strict minimum
permissions:
  contents: read

jobs:
  bench:
    name: Bench MLX (self-hosted Mac)
    runs-on: [self-hosted, macOS, klody]
    timeout-minutes: 60

    # Mode gateway (cf. README-local-ai.md) : un checkout frais n'a pas de .env, et
    # les défauts de config.py sont des ids HF bruts — que le resolver du gateway
    # rejette en 404. On fixe donc explicitement la base ET les ALIAS ici.
    env:
      BACKEND: mlx
      MLX_BASE_URL: http://127.0.0.1:8090/v1
      MLX_MODEL: brain
      MLX_CODE_MODEL: coder

    steps:
      - uses: actions/checkout@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Vérifier services locaux
        run: |
          # Le gateway Klody Core doit répondre sur MLX_BASE_URL.
          if ! curl -sf "$MLX_BASE_URL/models" > /dev/null; then
            echo "::error::Gateway Klody Core injoignable sur $MLX_BASE_URL. Le démarrer avant le run (cf. README-local-ai.md)."
            exit 1
          fi
          # Le port qui répond ne suffit pas : c'est la RÉSOLUTION D'ALIAS qui casse
          # en pratique (incident 2026-07-03 — un id périmé renvoie 404 « modèle
          # inconnu » et le bench part en échec sur les 20 tâches). On valide donc
          # chaque alias par une complétion d'un token avant de lancer quoi que ce soit.
          for alias in "$MLX_MODEL" "$MLX_CODE_MODEL"; do
            [ -z "$alias" ] && continue
            if ! curl -sf "$MLX_BASE_URL/chat/completions" \
                 -H "Content-Type: application/json" \
                 -d "{\"model\":\"$alias\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":1}" \
                 > /dev/null; then
              echo "::error::L'alias '$alias' ne résout pas sur $MLX_BASE_URL. Vérifier le resolver du gateway."
              exit 1
            fi
          done
          # Ollama (pour bge-m3)
          if ! curl -sf http://127.0.0.1:11434/api/tags > /dev/null; then
            echo "::warning::Ollama (port 11434) injoignable — embeddings dégradés."
          fi

      - name: Setup venv
        run: |
          if [ ! -d .venv ]; then
            python3.11 -m venv .venv
          fi
          source .venv/bin/activate
          pip install -r requirements.lock

      - name: Run bench
        env:
          PROJECT_ROOT: ${{ runner.temp }}/klody-bench
        run: |
          source .venv/bin/activate
          mkdir -p "$PROJECT_ROOT"
          category_flag=""
          if [ -n "${{ inputs.category }}" ]; then
            category_flag="--category ${{ inputs.category }}"
          fi
          python -m bench.run $category_flag --label "ci_nightly_$(date +%Y%m%d)"

      - name: Vérifier non-régression vs baseline
        run: |
          source .venv/bin/activate
          # Logique dans bench/gate.py (lintée par ruff, couverte par
          # tests/test_bench_gate.py) plutôt qu'en heredoc ici : la version inline
          # lisait un format que bench.run n'a jamais produit, et rien ne pouvait
          # l'attraper. Compare latest.json à la baseline versionnée, sur
          # l'intersection des task_id ; exit 1 si le taux de succès chute de >10 pts.
          python -m bench.gate

      - name: Upload résultats
        if: always()
        uses: actions/upload-artifact@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          name: bench-results-${{ github.run_id }}
          path: bench/results/
          retention-days: 30
