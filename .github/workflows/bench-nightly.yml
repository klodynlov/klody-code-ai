name: Bench nightly (MLX)

# Nightly bench non-régression. Tourne UNIQUEMENT sur runner self-hosted
# macOS avec la pile d'inférence locale joignable (Apple Silicon).
#
# Le job `verify-runner` monte la garde : sans runner portant les labels ci-dessous,
# un run planifié reste en file jusqu'à l'expiration GitHub (~24 h) puis est annulé
# sans un mot. C'est ce qui s'est produit sur l'intégralité des runs jusqu'au
# 2026-07-29 — 63 runs, aucune exécution réelle, aucun signal. La sentinelle coupe
# court après quelques minutes et DIT pourquoi.
#
# Setup requis (une fois) :
#   1. Settings → Actions → Runners → New self-hosted runner (macOS)
#   2. Labels : self-hosted, macOS, klody
#   3. Sur le Mac : le gateway Klody Core (:8090), Ollama et bge-m3 doivent tourner
#      avant le run planifié (LaunchAgents — cf. docs/OPS.md et README-local-ai.md)

on:
  schedule:
    # 03:00 UTC = 05:00 Paris (heure d'hiver) / 04:00 Paris (heure d'été)
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Catégorie (easy/medium/hard ou vide=toutes)"
        required: false
        default: ""

# GITHUB_TOKEN au strict minimum
permissions:
  contents: read

jobs:
  # Sentinelle : surveille que le job `bench` sorte de la file d'attente.
  #
  # Elle NE consulte PAS l'API des runners — `administration` n'existe pas parmi les
  # scopes accordables au GITHUB_TOKEN via `permissions:`, lister les runners
  # self-hosted demanderait donc un PAT en secret. On observe l'effet plutôt que la
  # cause : si `bench` est encore `queued` passé le délai de grâce, c'est qu'aucun
  # runner ne l'a pris — on annule le run avec un message explicite au lieu de le
  # laisser pourrir 24 h.
  #
  # Tourne en PARALLÈLE de `bench`, jamais en `needs:` — la sentinelle attend que
  # `bench` démarre, donc l'en faire dépendre les bloquerait mutuellement.
  verify-runner:
    name: Sentinelle runner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write # lire l'état des jobs du run, et l'annuler le cas échéant

    env:
      # Délai laissé à un runner pour prendre le job. Généreux à dessein : un Mac
      # qui sort de veille à 03:00 UTC met une minute ou deux, et le runner peut
      # être brièvement occupé par un run précédent.
      GRACE_SECONDS: "900"
      POLL_SECONDS: "30"
      SENTINEL_NAME: Sentinelle runner

    steps:
      - name: Attendre qu'un runner prenne le bench
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + GRACE_SECONDS ))
          # La sentinelle n'annule QUE sur preuve. Si l'API n'a jamais répondu, on ne
          # sait pas si le bench est en file ou en train de tourner — l'annuler
          # tuerait peut-être un run sain en accusant à tort le runner.
          seen_status=0

          # Statut du premier job du run qui n'est pas la sentinelle elle-même.
          # Filtrer par nom plutôt que le coder en dur garde la sentinelle valide
          # si le job bench est renommé.
          bench_status() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
                 --jq '.jobs[] | "\(.name)\t\(.status)"' 2>/dev/null \
              | grep -v "^$SENTINEL_NAME	" \
              | head -1 | cut -f2
          }

          while :; do
            status="$(bench_status || true)"

            if [ -n "$status" ]; then
              seen_status=1
              if [ "$status" != "queued" ] && [ "$status" != "waiting" ]; then
                echo "✓ Le bench est pris en charge (statut : $status) — sentinelle terminée."
                exit 0
              fi
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              if [ "$seen_status" -eq 0 ]; then
                echo "::warning title=Sentinelle aveugle::Impossible de lire l'état des \
          jobs du run pendant $((GRACE_SECONDS / 60)) min (API indisponible ?). Aucune \
          conclusion tirée, run laissé intact."
                exit 0
              fi
              echo "::error title=Aucun runner self-hosted::Le job bench est resté en \
          file plus de $((GRACE_SECONDS / 60)) min : aucun runner portant les labels \
          [self-hosted, macOS, klody] n'est disponible. Vérifier Settings → Actions → \
          Runners, et que la machine est allumée. Run annulé pour ne pas rester en \
          attente ~24 h."
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null
              # L'annulation emporte la sentinelle ; le exit ci-dessous n'est qu'un
              # filet si l'appel échoue (droits, API indisponible).
              exit 1
            fi

            echo "… bench ${status:-inconnu} — nouvelle vérification dans ${POLL_SECONDS}s"
            sleep "$POLL_SECONDS"
          done

  bench:
    name: Bench MLX (self-hosted Mac)
    runs-on: [self-hosted, macOS, klody]
    timeout-minutes: 60

    # Mode gateway (cf. README-local-ai.md) : un checkout frais n'a pas de .env, et
    # les défauts de config.py sont des ids HF bruts — que le resolver du gateway
    # rejette en 404. On fixe donc explicitement la base ET les ALIAS ici.
    env:
      BACKEND: mlx
      MLX_BASE_URL: http://127.0.0.1:8090/v1
      MLX_MODEL: brain
      MLX_CODE_MODEL: coder

    steps:
      - uses: actions/checkout@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Vérifier services locaux
        run: |
          # Le gateway Klody Core doit répondre sur MLX_BASE_URL.
          if ! curl -sf "$MLX_BASE_URL/models" > /dev/null; then
            echo "::error::Gateway Klody Core injoignable sur $MLX_BASE_URL. Le démarrer avant le run (cf. README-local-ai.md)."
            exit 1
          fi
          # Le port qui répond ne suffit pas : c'est la RÉSOLUTION D'ALIAS qui casse
          # en pratique (incident 2026-07-03 — un id périmé renvoie 404 « modèle
          # inconnu » et le bench part en échec sur les 20 tâches). On valide donc
          # chaque alias par une complétion d'un token avant de lancer quoi que ce soit.
          for alias in "$MLX_MODEL" "$MLX_CODE_MODEL"; do
            [ -z "$alias" ] && continue
            if ! curl -sf "$MLX_BASE_URL/chat/completions" \
                 -H "Content-Type: application/json" \
                 -d "{\"model\":\"$alias\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":1}" \
                 > /dev/null; then
              echo "::error::L'alias '$alias' ne résout pas sur $MLX_BASE_URL. Vérifier le resolver du gateway."
              exit 1
            fi
          done
          # Ollama (pour bge-m3)
          if ! curl -sf http://127.0.0.1:11434/api/tags > /dev/null; then
            echo "::warning::Ollama (port 11434) injoignable — embeddings dégradés."
          fi

      - name: Setup venv
        run: |
          if [ ! -d .venv ]; then
            python3.11 -m venv .venv
          fi
          source .venv/bin/activate
          pip install -r requirements.lock

      - name: Run bench
        env:
          PROJECT_ROOT: ${{ runner.temp }}/klody-bench
        run: |
          source .venv/bin/activate
          mkdir -p "$PROJECT_ROOT"
          category_flag=""
          if [ -n "${{ inputs.category }}" ]; then
            category_flag="--category ${{ inputs.category }}"
          fi
          python -m bench.run $category_flag --label "ci_nightly_$(date +%Y%m%d)"

      - name: Vérifier non-régression vs baseline
        run: |
          source .venv/bin/activate
          # Logique dans bench/gate.py (lintée par ruff, couverte par
          # tests/test_bench_gate.py) plutôt qu'en heredoc ici : la version inline
          # lisait un format que bench.run n'a jamais produit, et rien ne pouvait
          # l'attraper. Compare latest.json à la baseline versionnée, sur
          # l'intersection des task_id ; exit 1 si le taux de succès chute de >10 pts.
          python -m bench.gate

      - name: Upload résultats
        if: always()
        uses: actions/upload-artifact@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          name: bench-results-${{ github.run_id }}
          path: bench/results/
          retention-days: 30
